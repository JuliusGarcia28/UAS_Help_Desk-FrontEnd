<div class="technician-container">

  <aside class="sidebar">

    <div class="logo">
      <img src="img/Help_Desk_Logo_White.png" alt="HelpDesk">
      <span>HelpDesk</span>
    </div>

    <nav>
      <a routerLink="/technician/dashboard" routerLinkActive="active">
        <span class="material-icons">dashboard</span>
        Panel Técnico
      </a>

      <a routerLink="/technician/tickets" routerLinkActive="active">
        <span class="material-icons">confirmation_number</span>
        Tickets Asignados
      </a>
    </nav>

  </aside>

  <main class="content">

    <header class="topbar">
      <h1>Tech Panel</h1>

      <div class="spacer">

      <button
        class="theme-toggle"
        (click)="toggleTheme()">

        <span class="material-icons">
          {{ isDark() ? 'light_mode' : 'dark_mode' }}
        </span>

      </button>

      <button class="btn btn-outline logout-btn" style="display: flex; flex-direction: row; align-items: center;" (click)="logout()">
          <span class="material-icons" style="margin-right: 0.2rem;">logout</span>
          <span>Cerrar Sesión</span>
      </button>

      </div>
    </header>

    <section class="page">
      <router-outlet></router-outlet>
    </section>

  </main>

</div>
