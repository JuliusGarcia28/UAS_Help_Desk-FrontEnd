<div class="technician-container">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo">
      <img src="img/Help_Desk_Logo_White.png" alt="HelpDesk">
      <span>HelpDesk</span>
    </div>

    <nav>

      <a routerLink="/technician/dashboard" routerLinkActive="active">
        <span class="material-icons">dashboard</span>
        Panel Técnico
      </a>

      <a routerLink="/technician/tickets" routerLinkActive="active">
        <span class="material-icons">confirmation_number</span>
        Tickets Asignados
      </a>

    </nav>

  </aside>

  <!-- CONTENT -->
  <main class="content">

    <header class="topbar">

      <h1>Panel Técnico</h1>

      <div class="user-info">

        <span>
          {{ user.first_name }} {{ user.last_name }}
        </span>

        <button
          class="theme-toggle"
          (click)="toggleTheme()">

          <span class="material-icons">
            {{ isDark() ? 'light_mode' : 'dark_mode' }}
          </span>

        </button>

        <button
          class="btn btn-outline logout-btn"
          style="display:flex;align-items:center;"
          (click)="logout()">

          <span
            class="material-icons"
            style="margin-right:.2rem;">
            logout
          </span>

          <span>Cerrar Sesión</span>

        </button>

      </div>

    </header>

    <section class="page">
      <router-outlet></router-outlet>
    </section>

  </main>

</div>
