<div class="admin-container">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo">
      <img src="img/Help_Desk_Logo_White.png" alt="HelpDesk">
      <span>HelpDesk</span>
    </div>

    <nav>

      <a routerLink="/admin/users" routerLinkActive="active">
        <span class="material-icons">group</span>
        Usuarios
      </a>

      <a routerLink="/admin/assets" routerLinkActive="active">
        <span class="material-icons">inventory_2</span>
        Inventario
      </a>

      <a routerLink="/admin/departments" routerLinkActive="active">
        <span class="material-icons">apartment</span>
        Departamentos
      </a>

    </nav>

  </aside>

  <!-- CONTENT -->
  <main class="content">

    <header class="topbar">

      <h1>Admin Panel</h1>
      <!--span>
        {{ user.first_name }} {{ user.last_name }}
      </span-->

      <button class="btn btn-outline" style="display: flex; flex-direction: row; align-items: center;" (click)="logout()">
        <span class="material-icons" style="margin-right:0.2rem">logout</span>
        <span>Cerrar sesión</span>
      </button>
    </header>

    <section class="page">
      <router-outlet></router-outlet>
    </section>

  </main>

</div>
