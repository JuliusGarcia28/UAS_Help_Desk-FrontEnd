<div class="admin-container">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo">
      <img src="img/Help_Desk_Logo_White.png" alt="HelpDesk">
      <span>HelpDesk</span>
    </div>

    <nav>

      <a routerLink="/admin/users" routerLinkActive="active">
        <span class="material-icons">group</span>
        Usuarios
      </a>

      <a routerLink="/admin/assets" routerLinkActive="active">
        <span class="material-icons">inventory_2</span>
        Inventario
      </a>

      <a routerLink="/admin/departments" routerLinkActive="active">
        <span class="material-icons">apartment</span>
        Departamentos
      </a>

      <a routerLink="/admin/tickets" routerLinkActive="active">
        <span class="material-icons">confirmation_number</span>
        Tickets
      </a>

    </nav>

  </aside>

  <!-- CONTENT -->
  <main class="content">

  <header class="topbar">

  <h1>Admin Panel</h1>

  <div class="topbar-actions">

    <button
      class="theme-toggle"
      (click)="toggleTheme()">

      <span class="material-icons">
        {{ isDark() ? 'light_mode' : 'dark_mode' }}
      </span>

    </button>

    <button
      class="btn btn-outline"
      style="display:flex;align-items:center;"
      (click)="logout()">

      <span
        class="material-icons"
        style="margin-right:.2rem">
        logout
      </span>

      <span>Cerrar sesión</span>

    </button>

  </div>

  </header>

    <section class="page">
      <router-outlet></router-outlet>
    </section>

  </main>

</div>
