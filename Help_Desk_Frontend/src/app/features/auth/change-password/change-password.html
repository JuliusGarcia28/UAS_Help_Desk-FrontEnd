<section class="auth-section">

<div class="auth-container">

<div class="auth-card">

<h2>Cambiar contraseña</h2>

<form (ngSubmit)="save()">

<input
class="swal2-input"
type="password"
placeholder="Actual"
[(ngModel)]="currentPassword"
name="currentPassword">

<input
class="swal2-input"
type="password"
placeholder="Nueva"
[(ngModel)]="newPassword"
name="newPassword">

<input
class="swal2-input"
type="password"
placeholder="Confirmar"
[(ngModel)]="confirmPassword"
name="confirmPassword">

<button
class="btn btn-primary btn-full">

Guardar

</button>

</form>

<div class="error-box">

{{ error }}

</div>

}

<div class="success-box">

{{ success }}

</div>

}

</div>

</div>

</section>
