<section class="auth-section">

<div class="auth-container">

<div class="auth-card">

<h2>Recuperar contraseña</h2>

<p class="auth-subtitle">
Ingresa tu correo institucional.
</p>

<form (ngSubmit)="send()">

<div class="form-group">

<label>Correo</label>

<input
type="email"
[(ngModel)]="email"
name="email">

</div>

<button
class="btn btn-primary btn-full"
[disabled]="loading">

{{ loading
? 'Enviando...'
: 'Enviar enlace' }}

</button>

</form>

@if(error){

<div class="error-box">

{{ error }}

</div>

}

@if(success){

<div class="success-box">

{{ success }}

</div>

}

</div>

</div>

</section>
