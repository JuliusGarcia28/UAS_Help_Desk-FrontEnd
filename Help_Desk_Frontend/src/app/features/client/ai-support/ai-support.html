<div class="ai-container">

  <!-- HEADER -->
  <div class="ai-header">
    <div>
      <h2>Asistente IA</h2>
      <p>Describe tu problema técnico y recibirás ayuda automática</p>
    </div>
  </div>

  <!-- SELECT EQUIPO -->
  <div class="asset-select">

  <label>
    Equipo afectado
  </label>

  <select
    #assetSelect
    (change)="onAssetChange(assetSelect.value)">

    <option value="">
      Selecciona un equipo
    </option>

    <option
      *ngFor="let asset of assets"
      [value]="asset.id">

      {{ asset.hostname }} - {{ asset.asset_type }}

    </option>

  </select>

  </div>

  <!-- CHAT -->
  <div
    class="chat-box"
    [class.empty]="messages.length === 0">

    <div
      *ngFor="let msg of messages"
      class="message-wrapper"
      [ngClass]="msg.role">

      <div class="avatar">
        <span class="material-icons">
          {{ msg.role === 'assistant' ? 'smart_toy' : 'person' }}
        </span>
      </div>

      <div class="message-content">

        <div class="message-header">
          <span class="sender">
            {{ msg.role === 'assistant' ? 'Asistente IA' : 'Tú' }}
          </span>

          <span class="time">
            {{ currentTime }}
          </span>
        </div>

        <div class="bubble" [ngClass]="msg.role">
          <div class="formatted-text">
            {{ msg.content }}
          </div>
        </div>

      </div>

    </div>

    <!-- LOADING -->
    <div
      class="message-wrapper assistant loading-message"
      *ngIf="loading">

      <div class="avatar">
        <span class="material-icons">smart_toy</span>
      </div>

      <div class="message-content">
        <div class="bubble assistant typing">
          <span></span><span></span><span></span>
        </div>
      </div>

    </div>

  </div>

  <!-- INPUT -->
  <div class="chat-input">

    <textarea
      #problemInput
      placeholder="Describe el problema técnico..."
      [disabled]="loading"
    ></textarea>

    <button
      class="btn-send"
      (click)="sendProblem(problemInput)"
      [disabled]="loading || !selectedAssetId">

      <span class="material-icons">
        send
      </span>

      {{
        loading
        ? 'Analizando problema...'
        : 'Enviar'
      }}

    </button>

  </div>

  <!-- ACTIONS -->
  <div class="actions" *ngIf="session">

    <button class="btn-solved" (click)="solved()">
      <span class="material-icons">check_circle</span>
      Se solucionó
    </button>

    <button class="btn-escalate" (click)="escalate()">
      <span class="material-icons">support_agent</span>
      Escalar ticket
    </button>

  </div>

</div>
