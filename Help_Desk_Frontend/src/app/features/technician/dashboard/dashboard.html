<div class="page-header">
  <div>
    <h2>Panel técnico</h2>
    <p>Resumen de los tickets que tienes asignados</p>
  </div>

  <button class="btn btn-primary" routerLink="/technician/tickets">
    <span class="material-icons">confirmation_number</span>
    Ver mis tickets
  </button>
</div>

<div class="stat-grid stagger">

  <div class="stat-card stat-total">
    <div class="stat-icon"><span class="material-icons">confirmation_number</span></div>
    <div class="stat-info">
      <div class="stat-label">Total tickets</div>
      <div class="stat-value" [appCountUp]="totalTickets">0</div>
    </div>
  </div>

  <div class="stat-card stat-open">
    <div class="stat-icon"><span class="material-icons">mark_email_unread</span></div>
    <div class="stat-info">
      <div class="stat-label">Abiertos</div>
      <div class="stat-value" [appCountUp]="openTickets">0</div>
    </div>
  </div>

  <div class="stat-card stat-progress">
    <div class="stat-icon"><span class="material-icons">autorenew</span></div>
    <div class="stat-info">
      <div class="stat-label">En proceso</div>
      <div class="stat-value" [appCountUp]="inProgress">0</div>
    </div>
  </div>

  <div class="stat-card stat-closed">
    <div class="stat-icon"><span class="material-icons">task_alt</span></div>
    <div class="stat-info">
      <div class="stat-label">Cerrados</div>
      <div class="stat-value" [appCountUp]="closed">0</div>
    </div>
  </div>

</div>
