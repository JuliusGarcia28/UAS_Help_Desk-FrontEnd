<h2>Tickets</h2>

<div class="tabs" style="display:flex;gap:10px;margin-top:10px">
  <button class="btn" [class.active]="selected==='pendientes'" (click)="selected='pendientes'">Tickets pendientes ({{ countPending() }})</button>
  <button class="btn" [class.active]="selected==='asignados'" (click)="selected='asignados'">Tickets asignados ({{ countAssigned() }})</button>
  <button class="btn" [class.active]="selected==='resueltos'" (click)="selected='resueltos'">Tickets resueltos ({{ countResolved() }})</button>
</div>

<div *ngIf="filteredTickets().length > 0">
  <table class="table">
    <thead>
      <tr>
        <th>Descripción</th>
        <th>Prioridad</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let t of filteredTickets()">

        <td>{{ t.description | slice:0:50 }}{{ t.description.length > 50 ? '...' : '' }}</td>

        <td>
          <span class="badge"
            [ngClass]="{
            'low': t.priority === 1,
            'medium': t.priority === 2,
            'high': t.priority === 3
          }">
            {{ priorityMap[t.priority] }}
          </span>
        </td>

        <td>
          <span class="badge"
            [ngClass]="{
            'open': t.status === 1,
            'progress': t.status === 2,
            'closed': t.status === 3
          }">
            {{ statusMap[t.status] }}
          </span>
        </td>

        <td class="actions">
          <button class="btn btn-outline" (click)="viewHistory(t)">
            <span class="material-icons">history</span>
          </button>
        </td>

      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="filteredTickets().length === 0" style="margin-top:2rem">
  <p>No hay tickets para esta categoría.</p>
</div>
