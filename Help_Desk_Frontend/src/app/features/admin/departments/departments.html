<h2>Departamentos</h2>

<div class="filters">

  <input
    type="text"
    placeholder="Buscar departamento..."
    [(ngModel)]="searchTerm"
    (input)="applyFilters()"
  />

  <select [(ngModel)]="filterStatus" (change)="applyFilters()">
    <option value="">Todos</option>
    <option value="1">Activo</option>
    <option value="0">Inactivo</option>
  </select>

</div>

<button class="btn btn-primary btn-create" (click)="createDepartment()">
  + Nuevo departamento
</button>

<div class="tree-container">
  <ng-container *ngFor="let dep of tree">
    <ng-container *ngTemplateOutlet="recursiveTemplate; context:{ $implicit: dep, level: 0 }"></ng-container>
  </ng-container>
</div>

<!-- TEMPLATE RECURSIVO -->
<ng-template #recursiveTemplate let-dep let-level="level">

  <div class="tree-node">

    <div class="node-content" [style.marginLeft.px]="level * 20">

      <span class="tree-line" *ngIf="level > 0">│</span>

      <span class="node-name">
        {{ dep.name }}
      </span>

      <span
        class="status"
        [style.color]="dep.status === 1 ? 'green' : 'red'"
      >
        {{ dep.status === 1 ? 'Activo' : 'Inactivo' }}
      </span>

      <div class="actions">

        <button class="btn btn-outline" (click)="editDepartment(dep)">
          <span class="material-icons">edit</span>
        </button>

        <button
          class="btn"
          [ngClass]="dep.status === 1 ? 'btn-primary' : 'btn-outline'"
          (click)="toggleDepartment(dep)"
        >
          <span class="material-icons">
            {{ dep.status === 1 ? 'block' : 'check_circle' }}
          </span>
        </button>

      </div>

    </div>

    <!-- HIJOS -->
    <ng-container *ngFor="let child of dep.children">
      <ng-container *ngTemplateOutlet="recursiveTemplate; context:{ $implicit: child, level: level + 1 }"></ng-container>
    </ng-container>

  </div>

</ng-template>
