<h2>Usuarios</h2>

<div class="filters">

  <input
    type="text"
    placeholder="Buscar usuario..."
    [(ngModel)]="searchTerm"
    (input)="applyFilters()"
  />

  <select [(ngModel)]="filterRole" (change)="applyFilters()">
    <option value="">Todos los roles</option>
    <option value="admin">Admin</option>
    <option value="technician">Técnico</option>
    <option value="client">Cliente</option>
  </select>

  <select [(ngModel)]="filterStatus" (change)="applyFilters()">
    <option value="">Todos los estados</option>
    <option value="1">Activo</option>
    <option value="0">Inactivo</option>
  </select>

</div>

<button class="btn btn-primary btn-create" (click)="createUser()">
  + Nuevo usuario
</button>

<table class="table">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Email</th>
      <th>Rol</th>
      <th>Departamento</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let user of filteredUsers">

      <td>{{ user.first_name }} {{ user.last_name }}</td>
      <td>{{ user.email }}</td>
      <td>{{ roleMap[user.role] }}</td>
      <td>{{ user.department?.name || 'Sin asignar' }}</td>

      <td>
        <span [style.color]="user.status === 1 ? 'green' : 'red'">
          {{ user.status === 1 ? 'Activo' : 'Inactivo' }}
        </span>
      </td>

      <td class="actions">
        <button class="btn btn-outline" (click)="viewUser(user)">
          <span class="material-icons">visibility</span>
        </button>

        <button class="btn btn-outline" (click)="editUser(user)">
          <span class="material-icons">edit</span>
        </button>

        <button
          class="btn"
          [ngClass]="user.status === 1 ? 'btn-primary' : 'btn-outline'"
          (click)="toggleUser(user)"
        >
          <span class="material-icons">
            {{ user.status === 1 ? 'block' : 'check_circle' }}
          </span>
        </button>
      </td>

    </tr>
  </tbody>
</table>
